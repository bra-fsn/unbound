server:
	verbosity: 4
	num-threads: 2
	interface: 127.0.0.1
	port: @PORT@
	use-syslog: no
	directory: ""
	pidfile: "unbound_@NAME@.pid"
	chroot: ""
	username: ""
	do-not-query-localhost: no
	module-config: "validator cluster iterator"
	qname-minimisation: no
	target-fetch-policy: "0 0 0 0 0"
cluster:
	cluster-peer: 127.0.0.1@@PORT_A@
	cluster-peer: 127.0.0.1@@PORT_B@
	cluster-self: 127.0.0.1@@PORT@
	cluster-timeout: 500
remote-control:
	control-enable: yes
	control-interface: 127.0.0.1
	control-port: @CONTROL_PORT@
	server-key-file: "unbound_server.key"
	server-cert-file: "unbound_server.pem"
	control-key-file: "unbound_control.key"
	control-cert-file: "unbound_control.pem"
stub-zone:
	name: "example.com."
	stub-addr: "127.0.0.1@@AUTH_PORT@"
